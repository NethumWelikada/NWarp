# NWarp configuration file
# Lines starting with # are comments.

host = 0.0.0.0
port = 9090
document_root = ./www
server_name = NWarp
index = index.html
worker_threads = 4
access_log = ./logs/access.log
error_log = ./logs/error.log

# TLS / HTTPS (Phase 2)
# Generate a dev certificate with: ./scripts/generate-dev-cert.sh
tls_enabled = false
tls_port = 9443
tls_cert = ./certs/dev-cert.pem
tls_key = ./certs/dev-key.pem
