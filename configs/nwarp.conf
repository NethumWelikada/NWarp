# NWarp configuration file
# Lines starting with # are comments.

host = 0.0.0.0
port = 9090
document_root = ./www
server_name = NWarp
index = index.html
worker_threads = 4
access_log = ./logs/access.log
error_log = ./logs/error.log

# TLS / HTTPS (Phase 2)
# Generate a dev certificate with: ./scripts/generate-dev-cert.sh
tls_enabled = false
tls_port = 9443
tls_cert = ./certs/dev-cert.pem
tls_key = ./certs/dev-key.pem

# Reverse proxy / load balancing (Phase 3)
# Uncomment and edit to proxy a path prefix to one or more upstream
# servers, round-robin load balanced. Leave commented out to disable -
# static file serving is unaffected either way.
# proxy_route /api = http://127.0.0.1:5001,http://127.0.0.1:5002

# Upstream health checks (Phase 3.5) - only relevant if proxy_route is used
health_check_interval = 5
health_check_timeout = 2

