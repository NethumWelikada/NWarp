[package]
name = "nwarp"
version = "0.1.0"
edition = "2021"
authors = ["Nethum Welikada"]
description = "NWarp - a modern, high-performance HTTP web server written in Rust, built to go beyond Apache and Nginx"
license = "MIT"
repository = "https://github.com/YOUR-USERNAME/nwarp"

[[bin]]
name = "nwarpd"
path = "src/main.rs"

[dependencies]
rustls = "0.21"
rustls-pemfile = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
