[package]
name = "nwarp"
version = "0.1.0"
edition = "2021"
authors = ["Nethum Welikada"]
description = "NWarp - a modern, high-performance HTTP web server written in Rust, built to go beyond Apache and Nginx"
license = "MIT"
repository = "https://github.com/NethumWelikada/NWarp"

[[bin]]
name = "nwarpd"
path = "src/main.rs"

[dependencies]
rustls = "0.21"
rustls-pemfile = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "fs", "sync", "macros"] }
tokio-rustls = "0.24"
h2 = "0.3"
http = "0.2"
bytes = "1"
indexmap = "=2.2.6"
wasmi = "0.31"
quinn = "0.10"
h3 = "0.0.3"
h3-quinn = "0.0.4"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

